site_name: Engine
site_description: A 2D multiplayer game engine with an editor; games are written in Lua
docs_dir: docs
site_dir: site
repo_url: https://github.com/Saitamadupauvre/RType
edit_uri: edit/dev/docs/
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  subjects/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Making games:
      - guide/index.md
      - The editor: guide/editor-tour.md
      - Your first game: guide/first-game.md
      - Game folders and scenes: guide/game-folder.md
      - Scripting a game: guide/scripting.md
      - Play and debug: guide/play-and-debug.md
      - Run and export: guide/run-and-export.md
  - Lua API reference: reference/lua-api.md
  - Examples:
      - R-Type: examples/r-type.md
  - Engine internals:
      - Architecture: architecture.md
      - Engine modules: engine.md
      - Networking internals: networking.md
      - Protocol (RFC): protocol.md
      - Plugins: plugins.md
      - Editor backend: editor.md
      - Editor internals: editor-app.md
  - Project:
      - Overview and roadmap: PROJECT.md
      - Contributing: contributing.md
      - Commands: commands.md
      - Comparative study: comparative-study.md
      - Accessibility: accessibility.md
