name: Set up vcpkg
description: >
  Clone vcpkg at the builtin-baseline of vcpkg.json, bootstrap it, export
  VCPKG_ROOT for the CMake presets, and cache built packages and downloaded
  sources between runs.

inputs:
  cache-name:
    description: Separates the package cache of jobs that build differently, such as compilers.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Clone vcpkg at the baseline
      shell: bash
      run: |
        baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
        git clone --quiet https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
        git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
        echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=$RUNNER_TEMP/vcpkg-downloads" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/vcpkg-cache" "$RUNNER_TEMP/vcpkg-downloads"

    - name: Install raylib system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: >
        sudo apt-get update && sudo apt-get install -y
        autoconf autoconf-archive automake libtool pkg-config
        libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev xorg-dev libglu1-mesa-dev

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: '"%RUNNER_TEMP%\vcpkg\bootstrap-vcpkg.bat" -disableMetrics'

    - name: Bootstrap vcpkg (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: '"$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics'

    - name: Cache built packages
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-name }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-name }}-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-name }}-
          vcpkg-${{ runner.os }}-${{ github.job }}-

    - name: Cache downloaded sources
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/vcpkg-downloads
        key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-
          vcpkg-downloads-
