name: Bug report
description: Something does not work as documented or expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the existing issues first, and fill in as
        much as you can: a bug that can be reproduced gets fixed much faster.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps (or code) that shows the problem.
      placeholder: |
        1. Configure with `cmake --preset debug`
        2. Run `...`
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any error message.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Build, test or crash output. Pasted text is formatted as code automatically.
      render: shell

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking (no workaround)
        - Major (workaround exists)
        - Minor (cosmetic or rare)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Compiler and CMake versions
      placeholder: "GCC 14.2 / Clang 19 / MSVC 19.44, CMake 3.31"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RType version or commit
      placeholder: "v1.2.0, or the output of `git rev-parse --short HEAD`"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce it on the latest `main`.
