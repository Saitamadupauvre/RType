# Managed by project-bootstrap [40536492ea8dbdb6]: edits here are reported by `status`.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; pushes to branches all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
            ccache: true
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
            ccache: true
          - name: Windows MSVC
            os: windows-latest
            ccache: false
          - name: macOS Clang
            os: macos-latest
            ccache: true

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-vcpkg

      - name: Install ccache
        if: matrix.ccache
        run: ${{ runner.os == 'macOS' && 'brew install ccache' || 'sudo apt-get update && sudo apt-get install -y ccache' }}

      - uses: actions/cache@v6
        if: matrix.ccache
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure, build, test
        run: cmake --workflow --preset ci
        env:
          CXX: ${{ matrix.cxx }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache && 'ccache' || '' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-vcpkg

      # TSan cannot map its shadow memory with the runner's default ASLR entropy.
      - name: Lower ASLR entropy
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}
        env:
          CXX: clang++

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-vcpkg

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure and build with clang-tidy
        run: cmake --workflow --preset tidy
        env:
          CXX: clang++

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned: another clang-format version may format differently.
      - name: Install clang-format
        run: pipx install clang-format==23.1.1

      # Same files as the `format-check` target.
      - name: clang-format
        run: >
          git ls-files -- {engine,plugins,game,tests}/'*'.{cpp,hpp}
          | xargs -r clang-format --dry-run --Werror

  # Every job above passed on a push to main: the tested commit goes to the mirror.
  # `pb github mirror <ssh-url>` sets MIRROR_URL, MIRROR_KNOWN_HOSTS and MIRROR_SSH_KEY.
  mirror:
    name: Mirror
    needs: [build, sanitizers, tidy, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIRROR_URL: ${{ vars.MIRROR_URL }}
      HAS_KEY: ${{ secrets.MIRROR_SSH_KEY != '' }}
    steps:
      - if: env.MIRROR_URL == '' || env.HAS_KEY != 'true'
        run: echo "::warning::MIRROR_URL variable or MIRROR_SSH_KEY secret missing, nothing mirrored (run pb github mirror)"

      # Full history: a shallow clone cannot be pushed to an empty mirror.
      - if: env.MIRROR_URL != '' && env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to the mirror
        if: env.MIRROR_URL != '' && env.HAS_KEY == 'true'
        env:
          SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.MIRROR_KNOWN_HOSTS }}
        run: |
          key="$RUNNER_TEMP/mirror_key"
          hosts="$RUNNER_TEMP/mirror_known_hosts"
          (umask 077 && printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key")
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          check=yes
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::MIRROR_KNOWN_HOSTS variable missing: the mirror's host key is not checked"
            check=accept-new
          fi
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o UserKnownHostsFile='$hosts' -o StrictHostKeyChecking=$check"

          # Already there (a re-run, or a newer commit mirrored since): nothing to do.
          if git fetch --quiet "$MIRROR_URL" main 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "The mirror's main already contains $GITHUB_SHA"
            exit 0
          fi
          # Not forced: a mirror that diverged fails here instead of losing its commits.
          git push "$MIRROR_URL" "$GITHUB_SHA:refs/heads/main"
