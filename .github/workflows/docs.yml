# Managed by project-bootstrap [336dc847f11dbb7c]: edits here are reported by `status`.
# Builds the MkDocs site and the Doxygen HTML on every pull request; publishes them to GitHub Pages from main.
# Pages must use "GitHub Actions" as its source (`pb github settings` sets it).
name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-vcpkg

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install documentation tools
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Build the website
        run: mkdocs build --strict

      - name: Generate the API reference
        run: |
          cmake --preset release
          cmake --build --preset release --target docs
          cp -r build/release/docs/html site/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
